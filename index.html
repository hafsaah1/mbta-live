<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MA RMV Wait Times</title>
    <meta name="description" content="Live wait times at every Massachusetts RMV Service Center." />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Massachusetts RMV · Live Wait Times</div>
      <div class="status" id="status">loading…</div>
    </header>

    <main>
      <div id="map" aria-label="Map of Massachusetts RMV service centers"></div>

      <aside class="sidebar" id="sidebar">
        <div class="summary">
          <div class="row"><span>Total people waiting</span><strong id="totalWaiting">—</strong></div>
          <div class="row"><span>Longest wait</span><strong id="longestWait">—</strong></div>
          <div class="row tiny" id="updated">—</div>
        </div>
        <div class="legend">
          <div class="legend-title">licensing wait</div>
          <div class="legend-row"><span class="dot c-low"></span>&lt; 15 min</div>
          <div class="legend-row"><span class="dot c-mid"></span>15–45 min</div>
          <div class="legend-row"><span class="dot c-hi"></span>45–90 min</div>
          <div class="legend-row"><span class="dot c-vhi"></span>90+ min</div>
          <div class="legend-row"><span class="dot c-closed"></span>closed / no data</div>
        </div>
        <div class="branch-list" id="branchList"></div>
      </aside>
    </main>

    <footer>
      data from <a href="https://massgov.github.io/rmvwaittime/" target="_blank" rel="noopener">mass.gov / RMV</a>
      &nbsp;·&nbsp; map tiles by <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a>
      &nbsp;·&nbsp; built by <a href="https://hafsaah1.github.io" target="_blank" rel="noopener">hafsaah1</a>
    </footer>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="branches.js"></script>
    <script src="app.js"></script>
  </body>
</html>
